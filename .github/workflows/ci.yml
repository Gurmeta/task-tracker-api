name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Least privilege: jobs get read-only access unless they ask for more.
permissions:
  contents: read

# A new push to the same pull request cancels the older, now useless run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      # coverlet.collector writes a Cobertura report. EF Core migrations are generated code,
      # so they are left out of the numbers.
      - name: Test with coverage
        run: |
          dotnet test --no-build --configuration Release             --collect:"XPlat Code Coverage" --results-directory coverage             -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.ExcludeByFile="**/Migrations/**"

      - name: Coverage summary
        if: always()
        run: |
          report="$(find coverage -name coverage.cobertura.xml | head -n 1)"
          if [ -z "$report" ]; then
            echo "No coverage report found."
            exit 0
          fi
          python3 - "$report" >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import sys, xml.etree.ElementTree as ET
          root = ET.parse(sys.argv[1]).getroot()
          print("### Test coverage")
          print()
          print("| Metric | Covered |")
          print("| ------ | ------- |")
          print(f"| Lines | {float(root.get('line-rate')) * 100:.1f}% |")
          print(f"| Branches | {float(root.get('branch-rate')) * 100:.1f}% |")
          PY

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-report
          path: coverage/**/coverage.cobertura.xml
          if-no-files-found: ignore
          retention-days: 14

      - name: Check that migrations match the model
        run: |
          dotnet tool restore
          dotnet ef migrations has-pending-model-changes --project src/TaskTracker.Api

      - name: Check for vulnerable packages
        run: |
          dotnet list package --vulnerable --include-transitive 2>&1 | tee vulnerable.txt
          if grep -q "has the following vulnerable packages" vulnerable.txt; then
            echo "::error::Vulnerable NuGet packages found"
            exit 1
          fi

  image:
    name: Build, smoke-test and publish image
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write # lets the built-in GITHUB_TOKEN push to ghcr.io; no personal token is used
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # "latest" is reserved for stable releases (see release.yml); main builds are "edge".
      - name: Image tags and labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=edge,enable={{is_default_branch}}
            type=sha

      # Build once into the local Docker daemon so we can test the exact image we would publish.
      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          push: false
          tags: task-tracker-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the container
        run: |
          docker run -d --name task-tracker -p 8080:8080 task-tracker-api:ci

          for i in $(seq 1 30); do
            curl -fsS http://localhost:8080/health && break
            sleep 1
          done

          echo
          curl -fsS http://localhost:8080/health
          echo
          curl -fsS -X POST -H 'Content-Type: application/json' \
            -d '{"title":"ci smoke test"}' http://localhost:8080/tasks
          echo
          curl -fsS http://localhost:8080/tasks
          echo

          user="$(docker inspect --format '{{.Config.User}}' task-tracker)"
          echo "Container user: ${user:-<empty>}"
          if [ -z "$user" ] || [ "$user" = "0" ] || [ "$user" = "root" ]; then
            echo "::error::Container must not run as root"
            exit 1
          fi

      - name: Show container logs on failure
        if: failure()
        run: docker logs task-tracker || true

      - name: Remove container
        if: always()
        run: docker rm -f task-tracker || true

      # Publishing happens only for pushes to main, never for pull requests.
      # Version tags are handled by release.yml.
      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image
        if: github.event_name == 'push'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
